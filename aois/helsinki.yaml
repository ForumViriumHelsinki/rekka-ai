crs: "EPSG:3067"

aois:
  # ---------------------------------------------------------------------------
  #  the original ground-truth areas — the validation split lives here, but two
  #  of them (r1-kamppi, r1-rastila) moved to train on review. `split` is the
  #  authority on which side an area is on, never this heading.
  #
  #  `notes` is the annotation guide the web tool shows beside the map: what to
  #  look for and how to call it, nothing else. Why an area exists, or moved
  #  between splits, belongs in docs/rounds.md.
  # ---------------------------------------------------------------------------
  - name: r1-kamppi
    bbox: [385722, 6672138, 386022, 6672438]
    role: positive
    split: train
    notes: >-
      By the main railway station — street buses, vans and cars in the worst
      imagery in the collection: deep shadow, building lean, mosaic seams
      across a busy street. If a box is clearly a vehicle but its class is
      unreadable, guess the likeliest class rather than rejecting it.

  - name: r1-veturitie
    bbox: [385250, 6676490, 385550, 6676790]
    role: positive
    split: validation
    notes: >-
      Pohjolan Liikenne's bus yard, Veturitie 25 — ~70 coaches in rows on open
      concrete. The long commuter rows down the west side are `car`; rail
      rolling stock on the Pasila tracks to the east is not labelled at all;
      service vehicles are `van` or `truck` as usual.

  - name: r1-pohjois-haaga
    bbox: [382988, 6679083, 383288, 6679383]
    role: positive
    split: validation
    notes: Bus corridor.

  - name: r1-kaivoksela
    bbox: [382393, 6682731, 382693, 6683031]
    role: positive
    split: validation
    notes: >-
      Dealer and contractor yard — lots of different trucks, most with a
      visible cab at 9–10 m. The bare-sand south-west corner is a
      road-maintenance equipment store: plough blades, spreader and tipper
      bodies on the ground, no cabs. All of it is negative.

  - name: r1-jatkasaari
    bbox: [384523, 6671066, 384823, 6671366]
    role: positive
    split: validation
    notes: >-
      Hietalahti shipyard waterfront — trucks and vans among shipyard ground,
      some partly shadowed or occluded by cranes and hulls. Widens the
      validation set with a harbour/industrial character (reported at
      EPSG:3879 25495669.19, 6672072.87).

  - name: r1-rastila
    bbox: [395805, 6675894, 396105, 6676194]
    role: positive
    split: train
    notes: >-
      Rastila camping — rows of RVs and motorhomes, the guide's hardest
      confuser: a van-fronted motorhome is neither a van nor a truck, reject
      it. Real vans do park here among them, so the square is not all
      negative.

  # ---------------------------------------------------------------------------
  #  round one aois
  # ---------------------------------------------------------------------------
  - name: r1-tattariharju
    bbox: [392400, 6680436, 392700, 6680736]
    role: positive
    notes: Logistics district — box-trucks with visible cab; clean.

  - name: r1-tattariharjuntie
    bbox: [391857, 6680141, 392157, 6680441]
    role: positive
    notes: Transport yard, rows of parked trucks.

  - name: r1-kivikko
    bbox: [392573, 6680187, 392873, 6680487]
    role: positive
    notes: Logistics + some buses.

  - name: r1-malmi-airport
    bbox: [392196, 6680521, 392496, 6680821]
    role: positive
    notes: Truck parking adjacent to the logistics halls.

  - name: r1-myllypuro
    bbox: [392010, 6678590, 392310, 6678890]
    role: positive
    notes: Roadside/street-parked trucks near the district.

  - name: r1-valimo
    bbox: [381932, 6678232, 382232, 6678532]
    role: positive
    notes: Trucks, mostly 10-11.5 m straight trucks, plus a few vans. No buses.

  - name: r1-ruskeasuo
    bbox: [383654, 6676082, 384054, 6676482]
    role: positive
    notes: >-
      Ruskeasuon varikko — bus depot, rows of parked city buses plus service
      and maintenance vehicles. The bus training ground; the class had only 26
      instances project-wide before this area. Buses are the target here,
      trucks and vans are labelled as usual.

  - name: r1-patola
    bbox: [387983, 6679367, 388283, 6679667]
    role: positive
    notes: >-
      Isolated white cab-trucks — but in practice mostly vans/pickups and an
      uncertain read, so kept in train rather than held out as validation.

  - name: r1-puotinharju
    bbox: [393292, 6676591, 393592, 6676891]
    role: sparse
    notes: Mostly buildings + car parking; few outdoor trucks.

  - name: r1-hermanni
    bbox: [387647, 6674708, 387947, 6675008]
    role: positive
    notes: Platforms/swap bodies (lavoja) — keep only units with a visible cab; bare platforms are negatives.

  - name: r1-kylasaari
    bbox: [387379, 6675108, 387679, 6675408]
    role: positive
    notes: Straight trucks (kuorma-autoja).

  - name: r1-siltamaki
    bbox: [390113, 6684169, 390413, 6684469]
    role: positive
    notes: Trucks + a tractor. The long vans here are vans, not trucks — label them `van`, do not skip them.

  - name: r1-vuosaari-channel-road
    bbox: [399616, 6675947, 399916, 6676230]
    role: positive
    notes: Semi-trailer rigs (confirmed keep) + more semis, possibly timber loads.

  - name: r1-vuosaari-rahtarinkatu
    bbox: [398470, 6677656, 398870, 6677956]
    role: positive
    notes: Mixed yard — keep concrete mixers and confirmed trucks; bare trailers with no tractor unit are negatives; a lone tractor unit (bobtail) may fall under the 6 m length gate; van-fronted lookalikes (motorhome category) are hardest — avoid.

  - name: r1-marjaniemi
    bbox: [392628, 6674754, 392928, 6675054]
    role: hard-negative
    notes: >-
      Marina — moored boats and a winter yard of hulls on cradles. From above
      a hull on a cradle beside the road is the most truck-like shape in the
      collection; none of it is a target, reject every boat. The access road
      holds cars, and review turned up two vans.

  # ---------------------------------------------------------------------------
  #  round two aois — model-mined from the round-1 weights (docs/rounds.md).
  #  Aimed at the round-1 failure: cab-less truck-shaped objects detected as
  #  trucks. These squares hold containers and detached trailers *among* real
  #  rigs, so they teach the boundary rather than just "container = negative".
  #  Mined areas stay `split: train`; validation ground is chosen deliberately.
  # ---------------------------------------------------------------------------
  - name: r2-vuosaari-harbour-road
    bbox: [399300, 6676800, 399600, 6677100]
    role: hard-negative
    split: train
    notes: >-
      Vuosaari harbour container terminal — stacked containers by the hundred,
      straddle carriers, and no trucks at all: review found 53 candidates and
      kept none. Reject the containers and the detached trailers. A couple of
      real vans and a car sit on the access road and are labelled; leave them.

  - name: r2-vuosaari-trailer-road
    bbox: [399900, 6676800, 400200, 6677100]
    role: positive
    split: train
    notes: >-
      Vuosaari harbour, Trailer Road — rows of parked semi-trailers beside more
      container stacks. A trailer with no tractor is a negative; a coupled rig
      is one box, tractor and trailer together.

  - name: r2-kivikonlaita
    bbox: [391800, 6679200, 392100, 6679500]
    role: positive
    split: train
    notes: >-
      Kivikko industrial estate off Kehä I — material yards and mixed truck
      parking. Stored bodies, skips and bare platforms are negatives; keep the
      units with a visible cab.

  # ---------------------------------------------------------------------------
  #  round three aois — model-mined from the round-2 weights (docs/rounds.md).
  #  Aimed at what round 2 left failing: the r1-jatkasaari count gate (+36% in
  #  harbour ground) and `van` recall, stuck at 0.73 across two rounds.
  # ---------------------------------------------------------------------------
  - name: r3-olympiaterminaali
    bbox: [386400, 6671100, 386700, 6671400]
    role: positive
    split: train
    notes: >-
      Eteläsatama, the Olympia terminal quay — ferry trailers staged in rows
      along the water, with working rigs among them. A trailer with no tractor
      is a negative; a coupled rig is one box. Cranes and terminal clutter
      shadow the ground here.

  - name: r3-herttoniemi
    bbox: [391500, 6674400, 391800, 6674700]
    role: positive
    split: train
    notes: >-
      Herttoniemen yritysalue — delivery yards and loading docks off
      Sahaajankatu. Almost everything here sits in the 4–8 m band where van
      and truck blur: read the length before choosing, and remember a truck
      needs a visible cab and 6 m.

  - name: r3-roihupelto-varikko
    bbox: [392700, 6676800, 393000, 6677100]
    role: positive
    split: train
    notes: >-
      Roihupelto metro and tram depots — rolling stock on the tracks is not
      labelled at all, however truck-shaped it looks from above. The service
      vehicles and vans around the halls are labelled as usual.

  # ---------------------------------------------------------------------------
  #  round four aois
  # ---------------------------------------------------------------------------
  - name: r4-kruununhaka
    bbox: [385425, 6671250, 385725, 6671550]
    role: positive
    split: train
    notes: >-
      Downtown Kruununhaka, by Senate Square — old blocks, tram tracks, deep
      building shadow across the streets. Candidates are from the round-3
      weights (detect, conf 0.25): ~170, mostly parked cars, with misses in
      the deep shadows — add those by hand where readable. A shape in shadow
      whose class cannot be called with confidence is a reject, never a
      guess. Trams are not labelled.

  #  van-mined cells (docs/rounds.md, 2026-08-13): the top of
  #  data/mining/van-candidates-combined.yaml, one per shared yard, aimed at
  #  the truck/van confusion — every cell is dense in the 4-8 m band.
  - name: r4-tattarisuo
    bbox: [392100, 6681900, 392400, 6682200]
    role: positive
    split: train
    notes: >-
      Tattarisuo, Tuulilasintie — van-mined (z17 industrial sweep): 66 van
      detections (62 at conf>=0.5). Classify the truck/van band carefully:
      cab that stops and a load body that starts is a truck, one continuous
      shell is a van.

  - name: r4-tapulikaupunki
    bbox: [390600, 6684600, 390900, 6684900]
    role: positive
    split: train
    notes: >-
      Tapulikaupunki, Aamuruskontie — van-mined (z16 sweep of commercial
      landuse): 63 van detections (63 at conf>=0.5). Classify the truck/van
      band carefully.

  - name: r4-konala
    bbox: [380700, 6679800, 381000, 6680100]
    role: positive
    split: train
    notes: >-
      Konala, Ajomiehentie — van-mined (z16 sweep of commercial landuse): 48
      van detections (45 at conf>=0.5). Classify the truck/van band
      carefully.

  - name: r4-laippatie
    bbox: [392100, 6676200, 392400, 6676500]
    role: positive
    split: train
    notes: >-
      Roihupelto retail, Laippatie — van-mined (z16 sweep of commercial
      landuse): 45 van detections (44 at conf>=0.5). Classify the truck/van
      band carefully.

  - name: r4-hernesaari
    bbox: [384900, 6670200, 385200, 6670500]
    role: positive
    split: train
    notes: >-
      Hernesaari, Laivakatu — van-mined (z16 sweep of construction
      landuse): 34 van detections (32 at conf>=0.5). Active construction
      ground: keep working rigs and vans, reject plant and stored
      equipment. Classify the truck/van band carefully.

  - name: r4-herttoniemi-n
    bbox: [391500, 6675300, 391800, 6675600]
    role: positive
    split: train
    notes: >-
      Herttoniemen yritysalue north, Teollisuusneuvoksenkatu — found by both
      van-mining runs (z17 industrial: 32 detections; z16 construction: 33).
      Classify the truck/van band carefully.

  - name: r4-mustavuori
    bbox: [398567, 6680039, 398867, 6680339]
    role: hard-negative
    split: validation
    notes: >-
      Mustavuori forest — pure canopy and rock outcrops; a road and field
      skirt the NE corner but stay outside the cell. No candidates are
      staged (hard-negative role): if anything vehicle-like turns up, add a
      box; otherwise the area needs no work. This is validation's negative
      ground — the point is that there is nothing here.

  - name: r4-kapyla
    bbox: [386552, 6676755, 386852, 6677055]
    role: sparse
    split: validation
    notes: >-
      Käpylä apartment rows — red-brick blocks in mature greenery, courtyard
      parking pockets, little through traffic. This is validation's
      residential ground: label every car you can read (the negative check
      forgives only labelled vehicles), reject anything the tree canopy
      hides. Trains on the rail corridor at the southern edge are not
      labelled.

  - name: r4-orakas
    bbox: [393300, 6682800, 393600, 6683100]
    role: positive
    split: validation
    notes: >-
      Orakas, Heikinlaakso — a small industrial estate embedded in housing:
      little halls and contractor yards with trucks and trailers scattered
      among homes. Bare trailers with no tractor are negatives; a coupled
      rig is one box. Cars in the yards are labelled as usual.
