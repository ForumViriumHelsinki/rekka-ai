[project]
name = "rekka-ai"
version = "0.1.0"
description = "Truck detection from aerial images"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pyproj>=3.7.2",
    "pyyaml>=6.0.3",
    "shapely>=2.1.2",
    "typer>=0.27.0",
]

[project.scripts]
rekka-ai = "rekka_ai.cli:app"

[project.optional-dependencies]
detect = [
    "geopandas>=1.1.4",
    "ultralytics>=8.4.115",
]
train = [
    "mlflow>=3.15.1",
    "ultralytics>=8.4.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Imports of the optional extras (detect: ultralytics, geopandas; train:
# ultralytics, mlflow) are lazy on purpose, so the base install -- and CI --
# has none of them. ty cannot resolve what is not installed; that is the
# feature, not a bug. Ignore unresolved-import only in the files that do this.
[[tool.ty.overrides]]
include = [
    "src/rekka_ai/detect/detections.py",
    "src/rekka_ai/detect/sweep.py",
    "src/rekka_ai/enrich.py",
    "src/rekka_ai/evaluate.py",
    "src/rekka_ai/imagery/aoi.py",
    "src/rekka_ai/track.py",
    "src/rekka_ai/train.py",
]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
